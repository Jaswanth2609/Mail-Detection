# PhishScan Configuration
# All tunable weights, severity bands, gray-zone range, and detection catalogs

[weights]
auth_failure = 15
auth_failure_max = 30
domain_mismatch = 15
display_name_spoofing = 20
received_anomaly = 10
hidden_text = 15
invisible_characters = 10
urgency_credential_language = 10
low_text_image_ratio = 10
link_text_href_mismatch = 25
suspicious_url_structure = 15
lookalike_domain = 25
recent_domain = 15
threat_intel_url = 30
high_risk_attachment = 25
attachment_type_or_double_extension = 25
threat_intel_attachment = 40

[severity_bands]
low_max = 24
medium_max = 49
high_max = 74
critical_max = 100

[gray_zone]
min = 30
max = 70

[keywords]
urgency = [
    "urgent action required",
    "immediate action required",
    "action required immediately",
    "within 24 hours",
    "within 48 hours",
    "account suspended",
    "account will be suspended",
    "account suspended immediately",
    "account has been locked",
    "account locked",
    "access suspended",
    "access restricted",
    "security alert",
    "unauthorized access",
    "unauthorized login attempt",
    "suspicious activity detected",
    "verify your account",
    "verify identity",
    "confirm your identity",
    "verify your identity immediately",
    "password expired",
    "reset your password now",
    "update payment method",
    "billing problem",
    "payment failed",
    "click here to avoid deactivation",
    "failure to comply",
    "legal action",
    "wire transfer required",
    "payroll update required",
    "invoice overdue",
    "confidential document attached"
]

