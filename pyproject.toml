[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscan"
dynamic = ["version"]
description = "Offline-first rule-based email phishing detection and analysis CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "beautifulsoup4>=4.11.0",
    "httpx>=0.24.0",
]

[project.optional-dependencies]
full = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "tldextract>=3.4.0",
    "python-magic>=0.4.27",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
phishscan = "phishscan.cli:app_entry"

[tool.setuptools.dynamic]
version = {attr = "phishscan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
