[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "phishscan"
dynamic = ["version"]
description = "Deterministic rule-based email phishing detection and analysis CLI tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.11.0",
]

[project.scripts]
phishscan = "phishscan.cli:main"

[tool.setuptools.dynamic]
version = {attr = "phishscan.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
